<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI实验环境管家</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><a class="brand" href="/">AI 实验环境管家</a><span>课程环境 · 配置与验证</span></header>
<main><section class="intro"><p class="context">正式重建版 R1 · 本机使用</p><h1>先确定要学什么，<br>再把环境配到能运行。</h1><p>按学习目标开始，或进入老师发布的任务。检测在你的电脑进行，运行结果由报告核对。</p></section>
<div class="workspace"><section><h2>确定任务</h2><form id="goal-form"><label for="goal">我想配置</label><select id="goal"><option value="python-basics">Python 基础课程</option><option value="local-qwen">本地大模型入门</option><option value="other">其他目标</option></select><button>使用这个目标</button></form>
<form id="course-form"><label for="course-code">老师给了课程码</label><div class="inline"><input id="course-code" maxlength="10" autocomplete="off" placeholder="输入10位课程码"><button class="secondary">进入课程</button></div></form>
<details><summary>我是教师：发布固定任务</summary><form id="teacher-form"><label for="teacher-title">课程名称</label><input id="teacher-title" value="Python 基础实验"><label for="teacher-goal">任务场景</label><select id="teacher-goal"><option value="python-basics">Python 基础</option><option value="local-qwen">本地模型</option></select><div class="inline"><label>Python 最低版本<input id="python-min" value="3.10"></label><label>最高版本（不包含）<input id="python-max" value="3.15"></label></div><label for="requests-min">requests 最低版本（Python任务）</label><input id="requests-min" value="2.31"><button class="secondary">发布新任务</button></form><p id="published" role="status"></p><p class="muted">每次发布生成新课程码。本机地址仅供本机访问，尚未开放跨设备服务。</p></details>
</section><section id="task-panel" hidden><h2 id="task-title"></h2><p id="task-summary"></p><p class="muted" id="task-id"></p><button id="download-task" class="secondary">下载任务快照</button> <a id="download-tool" class="button" href="/api/tool">下载检测工具</a><div id="preparation"></div><label for="mode">指导方式</label><select id="mode"><option value="novice">新手：一步一步来</option><option value="standard">标准：看关键步骤</option><option value="quick">快捷：查看差异</option></select><div id="guidance"></div><div class="reports"><label>导入初检报告 A<input id="before-file" type="file" accept=".json,application/json"></label><label>导入复检报告 B<input id="after-file" type="file" accept=".json,application/json"></label></div><p id="comparison" role="status"></p><div id="results"></div><div id="diagnosis"></div><button id="export" class="secondary" disabled>预览可分享报告</button><textarea id="export-preview" hidden rows="10" aria-label="分享前可编辑报告"></textarea><button id="save-export" hidden>保存已编辑报告</button></section></div><p id="notice" class="notice" role="status" aria-live="polite">选择目标后查看具体课程要求。</p></main><footer>检测只读 · 安装与修复由本人决定 · 未验证的环境保留未知</footer></body></html>
